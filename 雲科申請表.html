<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Update</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #006dae; /* Windows 更新藍 */
            font-family: "Segoe UI", Segoe, Tahoma, Arial, sans-serif;
            color: white;
            overflow: hidden;
            cursor: default;
            user-select: none;
        }

        /* 初始進入按鈕 (為了繞過瀏覽器限制) */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #006dae;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid #fff;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        h1 { font-weight: 300; font-size: 32px; margin-bottom: 15px; }
        p { font-size: 18px; margin-bottom: 10px; opacity: 0.9; }

        /* 藍屏 (BSOD) */
        #bsod {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0078d7;
            padding: 10% 15%;
            text-align: left;
            z-index: 10000;
        }

        .sad-face { font-size: 120px; margin-bottom: 30px; }
        .bsod-msg { font-size: 24px; line-height: 1.5; max-width: 900px; }
    </style>
</head>
<body>

    <!-- 點擊層：這能解決雙螢幕下的全螢幕啟動問題 -->
    <div id="start-overlay" onclick="goPrank()">
        <p style="opacity: 0.5;">正在載入資源，請點擊畫面繼續...</p>
    </div>

    <!-- 更新內容 -->
    <div class="container">
        <div class="spinner"></div>
        <h1>正在處理更新 <span id="percent">0</span>%</h1>
        <p>請保持電腦開啟。這可能需要一點時間。</p>
        <p>您的電腦可能會重新啟動幾次。</p>
    </div>

    <!-- 藍屏內容 -->
    <div id="bsod">
        <div class="sad-face">:(</div>
        <div class="bsod-msg">
            您的裝置發生問題，因此必須重新啟動。我們剛才正在收集某些錯誤資訊，接著我們會為您重新啟動。<br><br>
            <span id="bsod-percent">0</span>% 完成
            <br><br>
            <small style="font-size: 14px;">如需詳細資訊，稍後可以線上搜尋此錯誤：CRITICAL_PROCESS_DIED</small>
        </div>
    </div>

    <script>
        const percentEl = document.getElementById('percent');
        const bsodEl = document.getElementById('bsod');
        const bsodPercentEl = document.getElementById('bsod-percent');
        let percent = 0;

        function goPrank() {
            // 1. 隱藏遮罩
            document.getElementById('start-overlay').style.display = 'none';
            document.body.style.cursor = 'none';

            // 2. 觸發全螢幕 (這在單一螢幕會生效)
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            // 3. 開始跑百分比
            const interval = setInterval(() => {
                if (percent < 99) {
                    percent += Math.floor(Math.random() * 2);
                    percentEl.innerText = percent;
                }
            }, 4000);

            // 4. 監控 Enter 鍵觸發藍屏
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    clearInterval(interval);
                    showBSOD();
                }
            });
        }

        function showBSOD() {
            bsodEl.style.display = 'block';
            let bp = 0;
            const bInterval = setInterval(() => {
                if (bp < 100) {
                    bp++;
                    bsodPercentEl.innerText = bp;
                } else {
                    clearInterval(bInterval);
                }
            }, 600);
        }
    </script>
</body>
</html>
